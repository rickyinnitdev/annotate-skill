<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="annotate-snap" content="1">
<title>Annotate · App</title>
<style>
  :root { color-scheme: dark; --bg: #09090b; --panel: #18181b; --btn: #27272a; --btn-h: #3f3f46; --line: #3f3f46;
    --text: #fafafa; --muted: #a1a1aa; --accent: #6366f1; --go: #16a34a; --sent: #f59e0b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  button { cursor: pointer; border: 0; border-radius: 8px; padding: 7px 12px; background: var(--btn); color: inherit; font: inherit; }
  button:hover:not(:disabled) { background: var(--btn-h); } button.on { background: var(--accent); } button.go { background: var(--go); }
  button:disabled { opacity: .4; cursor: default; }
  input { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: inherit; padding: 7px 10px; font: inherit; width: 200px; }
  .tools { display: flex; gap: 2px; }
  #status { color: var(--muted); margin-left: auto; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; padding: 16px; }
  @media (max-width: 800px) { main { grid-template-columns: minmax(0, 1fr); } }
  #frame { position: relative; align-self: start; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #000; min-height: 240px; }
  #frame canvas { display: block; width: 100%; height: auto; }
  #frame svg { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  #empty { padding: 48px 24px; color: var(--muted); text-align: center; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0; }
  video { width: 100%; border-radius: 8px; background: #000; display: none; } video.on { display: block; }
  #frames { display: flex; flex-wrap: wrap; gap: 6px; }
  #frames canvas { width: 72px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; }
  #frames canvas.on { border-color: var(--accent); }
  #list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #list li { background: var(--panel); border-radius: 8px; padding: 8px; border-left: 4px solid var(--accent); }
  #list li.sent { border-color: var(--sent); } #list li.done { border-color: var(--go); }
  .pop { position: absolute; z-index: 3; width: 280px; background: var(--panel); border-radius: 10px; padding: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .pop textarea { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: inherit; padding: 6px; font: inherit; }
  .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
  .hint { color: var(--muted); font-size: 12px; margin-right: auto; align-self: center; }
</style>
</head>
<body>
<header>
  <h1>Annotate · App</h1>
  <button id="choose">Choose window</button>
  <button id="capture" disabled>Capture</button>
  <input id="app-name" placeholder="App / screen name (optional)" aria-label="App or screen name">
  <span class="tools" id="tools"></span>
  <button id="send" class="go" disabled>Send to AI</button>
  <span id="status"></span>
</header>
<main>
  <div id="frame"><div id="empty">Choose a window, then press Capture. Draw on the frame to comment.</div></div>
  <aside>
    <h2>Live</h2>
    <video id="live" muted playsinline></video>
    <h2>Frames</h2>
    <div id="frames"></div>
    <h2>Comments</h2>
    <ul id="list"></ul>
  </aside>
</main>
<script src="/draw.js"></script>
<script src="/snap.js"></script>
</body>
</html>
